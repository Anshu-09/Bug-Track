# Server
server.port=${PORT:8081}

# PostgreSQL Database Connection
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/bugtrack}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:your_password_here}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Secret Key
jwt.secret=${JWT_SECRET:bugtrack_super_secret_key_change_this_in_production_32chars_minimum}
jwt.expiration=${JWT_EXPIRATION:86400000}
